name: Déploiement GitHub Pages

on:
  push:
    branches:
      - main
      # Branches de session Claude Code : exécutent les tests (retour rapide
      # pendant le développement) mais ne déploient JAMAIS en production —
      # cf. la condition explicite sur le job "deploy" ci-dessous
      # (TODO_AUDIT.md P0-5). Motif générique plutôt qu'un nom de branche en
      # dur, pour rester valable au-delà de la session courante.
      - "claude/**"
    # PAS de filtre "paths". Mesuré (TODO_AUDIT.md G21) : le constructeur de
    # branche de GitHub republie docs/ à CHAQUE push sur main, sans filtre et
    # sans attendre les tests — et il écrase l'artefact au passage. Si notre
    # workflow, lui, ne se déclenche pas (push ne touchant que des .md, par
    # exemple), l'artefact TESTÉ ne revient jamais : la version non testée
    # reste en ligne indéfiniment. C'est exactement ce qui est arrivé au
    # commit 57c7e44, qui ne modifiait que deux fichiers Markdown.
    # Tout push sur main doit donc redéployer.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Le groupe « pages » est réservé à main, la SEULE branche qui déploie.
  #
  # Défaut mesuré (TODO_AUDIT.md G21) : toutes les branches partageaient ce
  # groupe, y compris les branches « claude/** » qui exécutent les tests et
  # ne déploient JAMAIS. Avec cancel-in-progress, un simple push sur une
  # branche de session ANNULAIT donc le déploiement de production en cours.
  # C'est exactement ce qui est arrivé le 18 août 2026 : le run de main
  # (18:39:06) a été annulé à 18:43:34, quatre minutes après le démarrage
  # d'un run de branche à 18:43:14. L'artefact TESTÉ de cette tranche n'a donc
  # jamais été publié — et c'est la version non testée, mise en ligne par le
  # constructeur de branche de GitHub une minute après le push, qui est restée
  # seule en production.
  #
  # Chaque branche de test a désormais son propre groupe : elles s'annulent
  # entre elles (retour rapide, comportement voulu) sans jamais toucher à
  # main.
  group: ${{ github.ref == 'refs/heads/main' && 'pages' || format('tests-{0}', github.ref) }}
  # true (pas false) : si un nouveau push sur main arrive pendant qu'un
  # déploiement précédent est encore en cours, on annule l'ancien plutôt que
  # de le laisser se terminer et écraser APRÈS coup le déploiement plus
  # récent avec un contenu plus ancien (TODO_AUDIT.md P0-5, point 2 : "empêcher
  # deux branches de publier successivement des versions différentes").
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Utiliser Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Synchroniser le moteur partagé vers docs/
        run: cp engine/rugby-engine.js docs/rugby-engine.js
      - name: Tests moteur et données (sans navigateur)
        run: |
          node server/test-invariants.js
          node server/test-parcours-club.js
          node server/test-monde.js
          node server/test-audit-p0-1.js
          node server/test-audit-p0-2.js
          node server/test-equilibre-matchs.js
      - name: Installer Playwright (Chromium)
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Servir docs/ localement
        run: |
          python3 -m http.server 8099 --directory docs &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8099/index.html > /dev/null && exit 0
            sleep 1
          done
          echo "Le serveur local docs/ ne répond pas" >&2
          exit 1
      - name: Tests navigateur (parcours Mode Club)
        run: node server/test-parcours-navigateur.js http://localhost:8099
      - name: Tests navigateur (audit XSS nom de club)
        run: node server/test-audit-p0-3.js http://localhost:8099

  deploy:
    needs: test
    # Condition explicite (TODO_AUDIT.md P0-5) : SEUL "main" peut déployer en
    # production, quelle que soit la branche qui a déclenché le workflow —
    # filet de sécurité même si le déclencheur "on.push.branches" ci-dessus
    # changeait un jour par erreur. Une branche de session Claude peut donc
    # faire tourner "test" sans jamais atteindre ce job.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Synchroniser le moteur partagé vers docs/
        run: cp engine/rugby-engine.js docs/rugby-engine.js
      - name: Générer l'identifiant de version (TODO_AUDIT.md P0-5)
        run: |
          printf '{"commit":"%s","ref":"%s","deployedAt":"%s"}\n' \
            "${{ github.sha }}" "${{ github.ref_name }}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > docs/version.json
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    needs: deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Utiliser Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Attendre la disponibilité du site public déployé
        # Attendre que index.html RÉPONDE ne prouve rien : il répondait déjà,
        # servi par le déploiement PRÉCÉDENT. Ce test sortait donc en 0 s et
        # l'étape suivante interrogeait le CDN avant la propagation du nouveau
        # contenu — c'est ce qui a fait échouer `verify` sur le run 30718554172
        # (test et deploy verts, site correct 20 s plus tard). On attend
        # maintenant que version.json annonce RÉELLEMENT le commit déployé.
        run: |
          for i in $(seq 1 60); do
            publie=$(curl -sf "${{ needs.deploy.outputs.page_url }}version.json" | tr -d ' \n' | sed -n 's/.*"commit":"\([^"]*\)".*/\1/p')
            if [ "$publie" = "${{ github.sha }}" ]; then
              echo "Commit ${{ github.sha }} publié après $((i * 2)) s."
              exit 0
            fi
            sleep 2
          done
          echo "Le site public annonce encore '$publie' au lieu de ${{ github.sha }} après 120 s" >&2
          exit 1
      - name: Vérifier le site public réellement déployé (TODO_AUDIT.md P0-5)
        run: node server/test-deploy-public.js "${{ needs.deploy.outputs.page_url }}" --expect-commit "${{ github.sha }}"
